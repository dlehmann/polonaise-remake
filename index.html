<!doctype html>
<!--
  index.html - the page of its own for the game: the game fills the window. In the
  development server the script is src/main.ts; `npm run build` replaces it with
  polonaise.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#141022">
<title>Polonaise</title>
<meta name="description" content="A disco conga line in pixel art: lead the line over the dance floor and get every guest to join.">
<style>
:root { color-scheme: dark; }
html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
}
/* as large as fits into the window; the 34px are the button bar above the screen */
#polonaise {
    width: min(100vw, calc((100dvh - 34px) * 4 / 3));
}
</style>
</head>
<body>
<main id="polonaise" data-keyboard="page"></main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
